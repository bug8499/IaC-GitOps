apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-website-dev
  namespace: argocd
spec:
  project: sample-project
  source:
    repoURL: https://github.com/YOUR_ORG/iac-ops.git
    targetRevision: main
    path: GitOps/apps/overlays/dev/my-website   # ← ชี้ที่ overlay ของ website
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
