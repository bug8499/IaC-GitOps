apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mysitebug.duckdns.org      # ← ใส่ domain จริง
      secretName: my-website-tls
  rules:
    - host: mysitebug.duckdns.org    # ← ใส่ domain จริง
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-website
                port:
                  number: 80