apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      affinity:
        podAntiAffinity:
          # requiredDuringSchedulingIgnoredDuringExecution:
          preferredDuringSchedulingIgnoredDuringExecution:        # ← เปลี่ยนจาก requiredDuringSchedulingIgnoredDuringExecution
          - weight: 100                                            # ← เพิ่มบรรทัดนี้
            podAffinityTerm:                                       # ← เพิ่มบรรทัดนี้ (ครอบ labelSelector + topologyKey เดิม)
          
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - cloudflared
            topologyKey: kubernetes.io/hostname
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel-token
              key: token
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"