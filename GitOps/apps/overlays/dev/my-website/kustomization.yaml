apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../../../base/my-website
images:
- name: my-website
  newName: public.ecr.aws/r8m4q7l9/my-website
  newTag: 5137879d45ef5d03abf60a343375473bd80b6791
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.bug-website.com
  target:
    kind: Ingress
    name: my-website
